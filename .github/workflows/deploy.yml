name: Deploy AWS MCP
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation (destroy removes this deployment)
        type: choice
        options: [plan, apply, destroy]
        default: plan
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-mcp-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ vars.MCP_PROJECT_NAME || 'personal-mcp' }}
      TF_VAR_garmin_reserved_concurrency: ${{ vars.GARMIN_RESERVED_CONCURRENCY || '-1' }}
      TF_VAR_callback_urls: ${{ vars.MCP_CALLBACK_URLS || '["https://claude.ai/api/mcp/auth_callback","https://claude.com/api/mcp/auth_callback"]' }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      DEPLOY_ROLE: ${{ vars.AWS_ROLE_ARN }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.4'
          terraform_wrapper: false
      - name: Check setup variables
        run: python scripts/check_config.py
      - run: python -m pip install pytest==8.3.5 jsonschema==4.23.0 PyYAML==6.0.2
      - run: python -m pytest -q
      - run: python scripts/build.py
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: mcp-kit-deploy
      - name: Initialize private remote state
        run: |
          terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra validate
      - name: Plan
        if: inputs.operation == 'plan'
        run: terraform -chdir=infra plan -input=false
      - name: Apply
        if: inputs.operation == 'apply'
        run: |
          terraform -chdir=infra plan -input=false -out=deployment.tfplan
          terraform -chdir=infra apply -input=false deployment.tfplan
      - name: Connection details
        if: inputs.operation == 'apply'
        run: |
          terraform -chdir=infra output -json > outputs.json
          python scripts/connection_summary.py outputs.json
      - name: Check OAuth metadata
        if: inputs.operation == 'apply'
        run: python scripts/preflight.py --outputs outputs.json
      - name: Destroy
        if: inputs.operation == 'destroy'
        run: terraform -chdir=infra destroy -input=false -auto-approve
