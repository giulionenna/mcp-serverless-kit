name: Deploy AWS MCP
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation (destroy removes this deployment)
        type: choice
        options: [plan, apply, destroy]
        default: plan
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-mcp-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ vars.MCP_PROJECT_NAME || 'personal-mcp' }}
      TF_VAR_garmin_reserved_concurrency: ${{ vars.GARMIN_RESERVED_CONCURRENCY || '-1' }}
      TF_VAR_callback_urls: ${{ vars.MCP_CALLBACK_URLS || '["https://claude.ai/api/mcp/auth_callback","https://claude.com/api/mcp/auth_callback"]' }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      DEPLOY_ROLE: ${{ vars.AWS_ROLE_ARN }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      # This public repository also supports an owner-only Actions policy.
      - name: Check out the exact event commit without third-party Actions
        run: |
          git init "$GITHUB_WORKSPACE"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Set up Python 3.12 from the Ubuntu runner
        run: |
          python3.12 -m venv "$RUNNER_TEMP/validate-venv"
          echo "$RUNNER_TEMP/validate-venv/bin" >> "$GITHUB_PATH"
      - name: Install checksum-verified Terraform 1.13.4
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-tool"
          cd "$RUNNER_TEMP/terraform-tool"
          curl --fail --silent --show-error --location https://releases.hashicorp.com/terraform/1.13.4/terraform_1.13.4_linux_amd64.zip --output terraform_1.13.4_linux_amd64.zip
          curl --fail --silent --show-error --location https://releases.hashicorp.com/terraform/1.13.4/terraform_1.13.4_SHA256SUMS --output SHA256SUMS
          awk '$2 == "terraform_1.13.4_linux_amd64.zip"' SHA256SUMS > selected-checksum
          test -s selected-checksum
          sha256sum --check selected-checksum
          unzip -q terraform_1.13.4_linux_amd64.zip terraform
          echo "$RUNNER_TEMP/terraform-tool" >> "$GITHUB_PATH"
      - name: Check setup variables
        run: python scripts/check_config.py
      - run: python -m pip install pytest==8.3.5 jsonschema==4.23.0 PyYAML==6.0.2
      - run: python -m pytest -q
      - run: python scripts/build.py
      - name: Configure AWS web identity
        run: python scripts/github_oidc.py
      - name: Initialize private remote state
        run: |
          terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra validate
      - name: Plan
        if: inputs.operation == 'plan'
        run: terraform -chdir=infra plan -input=false
      - name: Apply
        if: inputs.operation == 'apply'
        run: |
          terraform -chdir=infra plan -input=false -out=deployment.tfplan
          terraform -chdir=infra apply -input=false deployment.tfplan
      - name: Connection details
        if: inputs.operation == 'apply'
        run: |
          terraform -chdir=infra output -json > outputs.json
          python scripts/connection_summary.py outputs.json
      - name: Check OAuth metadata
        if: inputs.operation == 'apply'
        run: python scripts/preflight.py --outputs outputs.json
      - name: Destroy
        if: inputs.operation == 'destroy'
        run: terraform -chdir=infra destroy -input=false -auto-approve
      - name: Remove temporary web identity token
        if: always()
        run: |
          if [ -n "${AWS_WEB_IDENTITY_TOKEN_FILE:-}" ]; then
            rm -f -- "$AWS_WEB_IDENTITY_TOKEN_FILE"
          fi
