name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.4'
          terraform_wrapper: false
      - run: python -m pip install pytest==8.3.5 jsonschema==4.23.0 PyYAML==6.0.2
      - run: python -m pytest -q
      - run: python -m pip install --require-hashes --only-binary=:all: -r scripts/garmin_login.requirements.lock
      - run: python -m pip check
      - run: python scripts/build.py
      - run: python scripts/build.py --config config/modules.garmin.example.json
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate
